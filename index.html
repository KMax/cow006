<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Корова 006 — Счётчик очков</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-sky: #38bdf8;
      --bg-sky-dark: #0284c7;
      --card-bg: #ffffff;
      --cow-amber: #f59e0b;
      --cow-spot: #451a03;
      --danger-red: #ef4444;
      --danger-soft: #fee2e2;
      --success-green: #10b981;
      --success-soft: #d1fae5;
      --text-dark: #1f2937;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --agent-dark: #1e293b;
      --radius: 16px;
      --shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.12), 0 4px 12px -2px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 50%, #0369a1 100%);
      color: var(--text-dark);
      min-height: 100vh;
      padding-bottom: calc(40px + env(safe-area-inset-bottom));
      overflow-x: hidden;
    }

    .sky-header {
      padding: calc(16px + env(safe-area-inset-top)) 16px 12px;
      text-align: center;
      color: white;
      text-shadow: 0 2px 4px rgba(0,0,0,0.25);
    }

    .badge-006 {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(4px);
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .title-banner {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-transform: uppercase;
    }

    .title-banner .cow-icon {
      font-size: 32px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }

    .subtitle {
      font-size: 13px;
      opacity: 0.95;
      margin-top: 2px;
      font-weight: 500;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 14px;
    }

    /* Cards & Panels */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--agent-dark);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .rule-chip {
      font-size: 11px;
      font-weight: 700;
      background: #fef3c7;
      color: #92400e;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid #fde68a;
    }

    /* Setup section */
    .player-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
    }

    .btn {
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s, opacity 0.2s, background-color 0.2s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: #0284c7;
      color: white;
    }
    .btn-primary:hover {
      background: #0369a1;
    }

    .btn-success {
      background: var(--success-green);
      color: white;
    }
    .btn-success:hover {
      background: #059669;
    }

    .btn-outline {
      background: #f8fafc;
      border: 1.5px solid var(--border-color);
      color: var(--text-dark);
    }
    .btn-outline:hover {
      background: #edf2f7;
    }

    .player-tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      min-height: 40px;
    }

    .player-tag {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 6px 12px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    .player-tag button {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 0 2px;
    }

    .player-tag button:hover {
      color: var(--danger-red);
    }

    /* Scoreboard Grid */
    .scoreboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .score-card {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      padding: 10px 8px;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s;
    }

    .score-card.is-leader {
      border-color: #10b981;
      background: #ecfdf5;
    }

    .score-card.is-danger {
      border-color: #f87171;
      background: #fef2f2;
    }

    .score-card.is-out {
      border-color: #b91c1c;
      background: #fee2e2;
    }

    .player-avatar {
      width: 40px;
      height: 40px;
      margin: 0 auto 4px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      border: 2px solid #e2e8f0;
    }

    .score-card-name {
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .score-card-points {
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
      color: var(--agent-dark);
    }

    .score-card-points span {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .danger-indicator {
      font-size: 11px;
      font-weight: 700;
      color: var(--danger-red);
      margin-top: 3px;
    }

    .progress-bar-bg {
      height: 5px;
      background: #e2e8f0;
      border-radius: 3px;
      margin-top: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: #0ea5e9;
      border-radius: 3px;
      transition: width 0.3s;
    }

    .progress-bar-fill.danger {
      background: var(--danger-red);
    }

    /* Round input form */
    .round-entry-form {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 14px;
      margin-top: 12px;
    }

    .player-score-input-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed #cbd5e1;
    }

    .player-score-input-row:last-child {
      border-bottom: none;
    }

    .player-score-name {
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-points-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-points-wrapper input {
      width: 75px;
      padding: 8px 6px;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
    }

    .input-points-wrapper input:focus {
      border-color: #0284c7;
      background: white;
    }

    /* Table History */
    .table-container {
      overflow-x: auto;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: center;
    }

    th {
      background: #f1f5f9;
      padding: 8px 6px;
      font-weight: 700;
      color: var(--text-dark);
      border-bottom: 2px solid #cbd5e1;
      white-space: nowrap;
    }

    td {
      padding: 8px 6px;
      border-bottom: 1px solid #e2e8f0;
      white-space: nowrap;
    }

    tr:nth-child(even) td {
      background: #f8fafc;
    }

    .round-col {
      font-weight: 700;
      color: #64748b;
      background: #f8fafc;
    }

    .score-cell-delta {
      font-weight: 700;
      color: #ef4444;
    }

    .score-cell-total {
      font-size: 11px;
      color: #64748b;
      margin-top: 1px;
    }

    .action-bar {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    /* Modal / Popups */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
      backdrop-filter: blur(4px);
      animation: fadeIn 0.2s ease-out;
    }

    .modal-content {
      background: white;
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      padding: 22px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
      text-align: center;
    }

    .modal-content h2 {
      font-size: 22px;
      font-weight: 900;
      color: #1e293b;
      margin-bottom: 4px;
    }

    .winner-spot {
      background: #ecfdf5;
      border: 2px solid #10b981;
      padding: 14px;
      border-radius: 14px;
      margin: 14px 0;
    }

    .winner-badge {
      font-size: 12px;
      font-weight: 800;
      color: #059669;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .winner-name {
      font-size: 20px;
      font-weight: 900;
      margin: 4px 0;
      color: #064e3b;
    }

    .winner-points {
      font-size: 14px;
      color: #047857;
      font-weight: 700;
    }

    .standings-list {
      text-align: left;
      margin: 14px 0;
      max-height: 180px;
      overflow-y: auto;
    }

    .standing-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
    }

    .standing-item:last-child {
      border-bottom: none;
    }

    .standing-rank {
      font-weight: 800;
      width: 24px;
      color: #64748b;
    }

    .standing-name {
      flex: 1;
      font-weight: 700;
      padding: 0 8px;
    }

    .standing-score {
      font-weight: 800;
      color: #1e293b;
    }

    .standing-score.out {
      color: var(--danger-red);
    }

    .empty-state {
      text-align: center;
      padding: 20px 8px;
      color: #64748b;
    }

    .empty-state .icon {
      font-size: 36px;
      margin-bottom: 6px;
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="sky-header">
    <div class="badge-006">🐮 СЕКРЕТНЫЙ АГЕНТ 006</div>
    <div class="title-banner">
      <span class="cow-icon">🐮</span>
      <span>КОРОВА 006</span>
      <span class="cow-icon">🤠</span>
    </div>
    <p class="subtitle">Журнал штрафных очков • Лимит: 66 🐮</p>
  </div>

  <div class="container">

    <!-- PANEL 1: PLAYERS SETUP -->
    <div class="card" id="setupCard">
      <div class="card-title">
        <span>Участники партии</span>
        <span class="rule-chip" id="playerCountChip">0 игроков</span>
      </div>

      <div class="player-input-row" id="addPlayerRow">
        <input type="text" id="playerNameInput" placeholder="Имя игрока (напр., Бурёнка)" maxlength="20">
        <button class="btn btn-primary" id="addPlayerBtn">
          Добавить
        </button>
      </div>

      <div class="player-tag-list" id="playerList"></div>

      <div id="setupActions" style="display: none;">
        <button class="btn btn-success" id="startGameBtn" style="width: 100%;">
          Начать партию
        </button>
      </div>
    </div>

    <!-- PANEL 2: ACTIVE GAME DASHBOARD -->
    <div id="gameCard" style="display: none;">
      
      <!-- Current Status Cards -->
      <div class="card">
        <div class="card-title">
          <span>Текущий счет</span>
          <span class="rule-chip" id="roundCounterChip">Раунд 1</span>
        </div>

        <div class="scoreboard-grid" id="scoreboardGrid"></div>

        <!-- Add Round Section -->
        <div class="round-entry-form" id="roundForm">
          <div style="font-weight: 800; font-size: 14px; margin-bottom: 8px; color: #1e293b;">
            ✏️ Внести штрафные очки за <span id="currentRoundTitle">Раунд 1</span>:
          </div>

          <div id="roundInputsContainer"></div>

          <div style="margin-top: 12px; display: flex; gap: 8px;">
            <button class="btn btn-primary" id="saveRoundBtn" style="flex: 1;">
              Записать раунд
            </button>
          </div>
        </div>

        <div class="action-bar">
          <button class="btn btn-outline" id="undoRoundBtn" style="flex: 1;">
            ↩️ Отменить раунд
          </button>
          <button class="btn btn-outline" id="newGamePromptBtn" style="flex: 1;">
            🔄 Новая игра
          </button>
        </div>
      </div>

      <!-- PANEL 3: ROUNDS HISTORY TABLE -->
      <div class="card">
        <div class="card-title">
          <span>Таблица раундов</span>
        </div>

        <div class="table-container" id="historyContainer">
          <table id="historyTable">
            <thead>
              <tr id="historyHeaderRow">
                <th class="round-col">Раунд</th>
              </tr>
            </thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <!-- MODAL: GAME OVER -->
  <div class="modal-overlay" id="gameOverModal" style="display: none;">
    <div class="modal-content">
      <div style="font-size: 42px; margin-bottom: 4px;">🏆🐮</div>
      <h2>Партия завершена!</h2>
      <p style="color: #64748b; font-size: 13px;">Кто-то перешагнул порог в 66 очков!</p>

      <div class="winner-spot">
        <div class="winner-badge">⭐ Главный победитель ⭐</div>
        <div class="winner-name" id="winnerName">—</div>
        <div class="winner-points" id="winnerPoints">— очков</div>
      </div>

      <div style="font-weight: 700; text-align: left; font-size: 13px; color: #475569; margin-top: 8px;">
        Итоговые результаты:
      </div>
      <div class="standings-list" id="finalStandingsList"></div>

      <div style="display: flex; gap: 8px; margin-top: 14px;">
        <button class="btn btn-primary" id="rematchSameBtn" style="flex: 1;">
          Те же игроки
        </button>
        <button class="btn btn-outline" id="rematchNewBtn" style="flex: 1;">
          Новые игроки
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- Telegram WebApp SDK Initialization ---
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      try {
        tg.headerColor = '#38bdf8';
        tg.backgroundColor = '#0369a1';
      } catch (e) {}
    }

    function triggerHaptic(type = 'light') {
      if (tg && tg.HapticFeedback) {
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else if (type === 'warning') tg.HapticFeedback.notificationOccurred('warning');
        else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
        else tg.HapticFeedback.impactOccurred('light');
      }
    }

    // --- State Management ---
    const STORAGE_KEY = 'cow006_telegram_state_v1';
    const AVATARS = ['🐮', '🤠', '🕵️‍♂️', '🌾', '🥛', '🚜', '🐂', '🔔', '👑', '🐴'];

    let state = {
      players: [],
      rounds: [],
      isGameActive: false
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          state = JSON.parse(saved);
        }
      } catch (e) {
        console.error('Ошибка загрузки данных:', e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('Ошибка сохранения:', e);
      }
    }

    function getPlayerTotalScore(playerId) {
      return state.rounds.reduce((sum, r) => sum + (Number(r.scores[playerId]) || 0), 0);
    }

    function checkGameOver() {
      if (!state.isGameActive || state.rounds.length === 0) return false;
      return state.players.some(p => getPlayerTotalScore(p.id) >= 66);
    }

    // --- Renderers ---
    function render() {
      renderSetupCard();
      renderGameCard();
      renderScoreboard();
      renderRoundInputs();
      renderHistoryTable();
      renderGameOverModal();
    }

    function renderSetupCard() {
      const setupCard = document.getElementById('setupCard');
      const playerList = document.getElementById('playerList');
      const setupActions = document.getElementById('setupActions');
      const playerCountChip = document.getElementById('playerCountChip');

      playerCountChip.textContent = `${state.players.length} ${getNoun(state.players.length, 'игрок', 'игрока', 'игроков')}`;

      if (state.isGameActive) {
        setupCard.style.display = 'none';
        return;
      }

      setupCard.style.display = 'block';
      playerList.innerHTML = '';

      if (state.players.length === 0) {
        playerList.innerHTML = `
          <div class="empty-state" style="width: 100%;">
            <span class="icon">🐮📋</span>
            Добавьте от 2 игроков, чтобы начать!
          </div>
        `;
      } else {
        state.players.forEach(p => {
          const tag = document.createElement('div');
          tag.className = 'player-tag';
          tag.innerHTML = `
            <span>${p.avatar}</span>
            <span>${escapeHtml(p.name)}</span>
            <button title="Удалить" onclick="removePlayer('${p.id}')">×</button>
          `;
          playerList.appendChild(tag);
        });
      }

      setupActions.style.display = state.players.length >= 2 ? 'block' : 'none';
    }

    function renderGameCard() {
      const gameCard = document.getElementById('gameCard');
      gameCard.style.display = state.isGameActive ? 'block' : 'none';
      if (!state.isGameActive) return;

      const currentRoundNum = state.rounds.length + 1;
      document.getElementById('roundCounterChip').textContent = `Раунд ${currentRoundNum}`;
      document.getElementById('currentRoundTitle').textContent = `Раунд ${currentRoundNum}`;

      const undoBtn = document.getElementById('undoRoundBtn');
      undoBtn.disabled = state.rounds.length === 0;
      undoBtn.style.opacity = state.rounds.length === 0 ? '0.5' : '1';
    }

    function renderScoreboard() {
      if (!state.isGameActive) return;

      const grid = document.getElementById('scoreboardGrid');
      grid.innerHTML = '';

      const scores = state.players.map(p => ({
        ...p,
        total: getPlayerTotalScore(p.id)
      }));

      const minScore = Math.min(...scores.map(s => s.total));

      scores.forEach(p => {
        const isLeader = p.total === minScore && state.rounds.length > 0;
        const isDanger = p.total >= 50 && p.total < 66;
        const isOut = p.total >= 66;

        let cardClass = 'score-card';
        if (isOut) cardClass += ' is-out';
        else if (isDanger) cardClass += ' is-danger';
        else if (isLeader) cardClass += ' is-leader';

        const fillWidth = Math.min(100, Math.round((p.total / 66) * 100));

        const card = document.createElement('div');
        card.className = cardClass;
        card.innerHTML = `
          <div class="player-avatar">${p.avatar}</div>
          <div class="score-card-name" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</div>
          <div class="score-card-points">${p.total} <span>🐮</span></div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill ${p.total >= 50 ? 'danger' : ''}" style="width: ${fillWidth}%"></div>
          </div>
          ${isOut ? '<div class="danger-indicator">⛔ ПОРОГ 66!</div>' : (isDanger ? '<div class="danger-indicator">⚠️ Опасно!</div>' : '')}
        `;
        grid.appendChild(card);
      });
    }

    function renderRoundInputs() {
      if (!state.isGameActive) return;

      const container = document.getElementById('roundInputsContainer');
      container.innerHTML = '';

      state.players.forEach(p => {
        const row = document.createElement('div');
        row.className = 'player-score-input-row';
        row.innerHTML = `
          <div class="player-score-name">
            <span>${p.avatar}</span>
            <span>${escapeHtml(p.name)}</span>
          </div>
          <div class="input-points-wrapper">
            <input type="number" 
                   min="0" 
                   max="999" 
                   placeholder="0" 
                   id="scoreInput_${p.id}" 
                   class="round-point-input"
                   inputmode="numeric">
            <span style="font-weight: 700; color: #64748b;">🐮</span>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function renderHistoryTable() {
      if (!state.isGameActive) return;

      const theadRow = document.getElementById('historyHeaderRow');
      const tbody = document.getElementById('historyBody');

      theadRow.innerHTML = '<th class="round-col">Раунд</th>';
      tbody.innerHTML = '';

      state.players.forEach(p => {
        const th = document.createElement('th');
        th.innerHTML = `${p.avatar} ${escapeHtml(p.name)}`;
        theadRow.appendChild(th);
      });

      if (state.rounds.length === 0) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="${state.players.length + 1}" style="color: #94a3b8; padding: 18px;">Пока нет сыгранных раундов</td>`;
        tbody.appendChild(tr);
        return;
      }

      const runTotals = {};
      state.players.forEach(p => { runTotals[p.id] = 0; });

      state.rounds.forEach(round => {
        const tr = document.createElement('tr');
        let html = `<td class="round-col">#${round.roundNum}</td>`;

        state.players.forEach(p => {
          const delta = Number(round.scores[p.id]) || 0;
          runTotals[p.id] += delta;
          html += `
            <td>
              <div class="score-cell-delta">+${delta}</div>
              <div class="score-cell-total">${runTotals[p.id]}</div>
            </td>
          `;
        });

        tr.innerHTML = html;
        tbody.appendChild(tr);
      });
    }

    function renderGameOverModal() {
      const modal = document.getElementById('gameOverModal');
      const isOver = checkGameOver();

      if (!isOver) {
        modal.style.display = 'none';
        return;
      }

      modal.style.display = 'flex';
      triggerHaptic('warning');

      const ranked = state.players.map(p => ({
        ...p,
        total: getPlayerTotalScore(p.id)
      })).sort((a, b) => a.total - b.total);

      const winner = ranked[0];
      document.getElementById('winnerName').textContent = `${winner.avatar} ${winner.name}`;
      document.getElementById('winnerPoints').textContent = `${winner.total} штрафных очков`;

      const listContainer = document.getElementById('finalStandingsList');
      listContainer.innerHTML = '';

      ranked.forEach((p, idx) => {
        const row = document.createElement('div');
        row.className = 'standing-item';
        const rankIcon = idx === 0 ? '🥇' : (idx === 1 ? '🥈' : (idx === 2 ? '🥉' : `${idx + 1}.`));
        row.innerHTML = `
          <span class="standing-rank">${rankIcon}</span>
          <span class="standing-name">${p.avatar} ${escapeHtml(p.name)}</span>
          <span class="standing-score ${p.total >= 66 ? 'out' : ''}">${p.total} 🐮</span>
        `;
        listContainer.appendChild(row);
      });
    }

    // --- Action Handlers ---
    function addPlayer() {
      const input = document.getElementById('playerNameInput');
      const name = input.value.trim();
      if (!name) return;

      triggerHaptic('light');
      const avatar = AVATARS[state.players.length % AVATARS.length];
      state.players.push({
        id: 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        name: name,
        avatar: avatar
      });

      saveState();
      render();
      input.value = '';
      input.focus();
    }

    function removePlayer(playerId) {
      triggerHaptic('light');
      state.players = state.players.filter(p => p.id !== playerId);
      saveState();
      render();
    }

    function startGame() {
      if (state.players.length < 2) return;
      triggerHaptic('success');
      state.isGameActive = true;
      state.rounds = [];
      saveState();
      render();
    }

    function saveRound() {
      const scores = {};
      let hasError = false;

      state.players.forEach(p => {
        const input = document.getElementById(`scoreInput_${p.id}`);
        const val = input ? input.value.trim() : '0';
        const num = val === '' ? 0 : parseInt(val, 10);
        if (isNaN(num) || num < 0) {
          hasError = true;
        }
        scores[p.id] = num || 0;
      });

      if (hasError) {
        triggerHaptic('error');
        alert('Введите корректные положительные очки.');
        return;
      }

      triggerHaptic('success');
      state.rounds.push({
        roundNum: state.rounds.length + 1,
        scores: scores
      });

      saveState();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function undoLastRound() {
      if (state.rounds.length === 0) return;
      if (confirm('Отменить последний раунд?')) {
        triggerHaptic('light');
        state.rounds.pop();
        saveState();
        render();
      }
    }

    function startNewGame(keepPlayers) {
      if (!confirm('Начать новую партию? Счёт будет сброшен.')) return;
      triggerHaptic('light');

      state.rounds = [];
      if (!keepPlayers) {
        state.players = [];
        state.isGameActive = false;
      } else {
        state.isGameActive = true;
      }

      saveState();
      render();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function getNoun(number, one, two, five) {
      let n = Math.abs(number);
      n %= 100;
      if (n >= 5 && n <= 20) return five;
      n %= 10;
      if (n === 1) return one;
      if (n >= 2 && n <= 4) return two;
      return five;
    }

    // --- Init ---
    document.addEventListener('DOMContentLoaded', () => {
      loadState();

      document.getElementById('addPlayerBtn').addEventListener('click', addPlayer);
      document.getElementById('playerNameInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') addPlayer();
      });

      document.getElementById('startGameBtn').addEventListener('click', startGame);
      document.getElementById('saveRoundBtn').addEventListener('click', saveRound);
      document.getElementById('undoRoundBtn').addEventListener('click', undoLastRound);
      
      document.getElementById('newGamePromptBtn').addEventListener('click', () => {
        startNewGame(true);
      });

      document.getElementById('rematchSameBtn').addEventListener('click', () => {
        state.rounds = [];
        saveState();
        render();
      });

      document.getElementById('rematchNewBtn').addEventListener('click', () => {
        startNewGame(false);
      });

      render();
    });
  </script>
</body>
</html>
